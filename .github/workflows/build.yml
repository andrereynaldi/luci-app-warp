name: Build IPK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PACKAGE_NAME: luci-app-warp

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
        include:
          - arch: x86_64
            sdk_url: https://downloads.openwrt.org/releases/23.05.5/targets/x86/64/openwrt-sdk-23.05.5-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: luci-app-warp

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Download SDK
        run: |
          wget -q ${{ matrix.sdk_url }} -O openwrt-sdk.tar.xz
          tar -xf openwrt-sdk.tar.xz
          mv openwrt-sdk-* openwrt-sdk

      - name: Prepare Package
        run: |
          # Copy package to SDK
          cp -r luci-app-warp openwrt-sdk/package/
          
          # Update feeds
          cd openwrt-sdk
          echo "src-git base https://git.openwrt.org/openwrt/openwrt.git;openwrt-23.05" > feeds.conf
          echo "src-git packages https://git.openwrt.org/feed/packages.git;openwrt-23.05" >> feeds.conf
          echo "src-git luci https://git.openwrt.org/project/luci.git;openwrt-23.05" >> feeds.conf
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # Enable package in config
          echo "CONFIG_PACKAGE_luci-app-warp=m" >> .config
          make defconfig

      - name: Build Package
        run: |
          cd openwrt-sdk
          make package/luci-app-warp/compile V=s -j$(nproc) || make package/luci-app-warp/compile V=s -j1

      - name: Collect Artifacts
        run: |
          mkdir -p artifacts
          find openwrt-sdk/bin -name "*luci-app-warp*.ipk" -exec cp {} artifacts/ \;
          ls -la artifacts/ || echo "No artifacts found"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ matrix.arch }}
          path: artifacts/*.ipk
          if-no-files-found: warn

  build-warp-binaries:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch: x86_64
            goos: linux
            goarch: amd64
          - arch: aarch64
            goos: linux
            goarch: arm64
          - arch: arm_v7
            goos: linux
            goarch: arm
            goarm: 7
          - arch: mipsel_24kc
            goos: linux
            goarch: mipsle
            gomips: softfloat
    steps:
      - name: Checkout cloudflare-warp
        uses: actions/checkout@v4
        with:
          repository: shahradelahi/cloudflare-warp
          path: cloudflare-warp
          
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          
      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: '0'
        run: |
          cd cloudflare-warp
          go build -trimpath -ldflags="-s -w" -o ../warp-${{ matrix.arch }} .
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: warp-binaries-${{ matrix.arch }}
          path: warp-${{ matrix.arch }}
          if-no-files-found: warn

  release:
    needs: [build, build-warp-binaries]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p release
          find artifacts -name "*.ipk" -exec cp {} release/ \;
          echo "=== IPK files ==="
          ls -la release/ || true
          echo "=== Binary files ==="
          find artifacts -name "warp-*" -type f || true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.ipk
            artifacts/warp-binaries-*/warp-*
          body: |
            ## Cloudflare WARP for OpenWrt ${{ github.ref_name }}
            
            ### 架构升级说明
            本项目已全面迁移至 [cloudflare-warp](https://github.com/shahradelahi/cloudflare-warp) 和 `ipt2socks` 透明代理架构，不再使用废弃的 `usque`。
            
            ### 安装说明
            1. 下载 `luci-app-warp_*_all.ipk`。
            2. 根据你的路由器架构下载对应的 `warp-*` 二进制文件。
            3. 将二进制文件重命名为 `warp`，上传到路由器的 `/usr/bin/` 目录并赋予执行权限 (`chmod +x /usr/bin/warp`)。
            4. 路由器端安装 `ipt2socks`：`opkg update && opkg install ipt2socks`。
            5. 路由器端安装本插件：`opkg install luci-app-warp_*.ipk`。
            
            ### 依赖要求
            - `kmod-nft-tproxy`: 必须，用于透明代理支持。
            - `ipt2socks`: 必须，负责 TPROXY 转发。
            - `cloudflare-warp`: 必须，请从本 release 下载对应架构的预编译文件。
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
